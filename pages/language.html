<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتقان | اختر لغة النظام</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>

<body data-page="language">

  <div class="simple-page">
    <header class="simple-header">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-name">إتقان</div>
          <div class="brand-sub">منصة المعاملات</div>
        </div>
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
      </div>
    </header>

    <main class="simple-body">
      <div class="round-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z" />
        </svg>
      </div>
      <div class="step-label">02 / 01</div>
      <h1>اختر لغة النظام</h1>
      <p class="subtitle">يمكنك تغيير اللغة لاحقاً من الإعدادات</p>

      <div class="lang-cards">
        <div class="lang-card" data-lang="en">
          <span class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <div class="lang-avatar">A</div>
          <div class="lc-title">English</div>
          <div class="lc-sub">English</div>
        </div>
        <div class="lang-card selected" data-lang="ar">
          <span class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <div class="lang-avatar">ع</div>
          <div class="lc-title">العربية</div>
          <div class="lc-sub">Arabic</div>
        </div>
      </div>

      <button class="btn btn-primary" type="button" data-goto="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M11 6l-6 6 6 6" />
        </svg>
        متابعة
      </button>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/motion.js"></script>
  <script src="../js/navigation.js"></script>
</body>

</html>
