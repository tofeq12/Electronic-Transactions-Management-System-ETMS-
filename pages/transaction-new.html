    <main class="main-area">
      <div class="panel form-panel">
        <div class="form-panel-header">إنشاء معاملة جديدة</div>
        <div class="form-panel-body">
          <form id="transaction-form">
            <div class="form-section-title">بيانات المعاملة</div>
            <div class="form-grid">
              <div class="field">
                <label for="trx-no">رقم المعاملة</label>
                <input type="text" id="trx-no" value="AUTO" disabled>
              </div>
              <div class="field">
                <label for="trx-type">نوع المعاملة</label>
                <select id="trx-type" name="type">
                  <option>تحويل مبلغ</option>
                  <option>شراء أجهزة</option>
                  <option>دفع فواتير</option>
                  <option>تعاقد</option>
                </select>
              </div>

              <div class="field field-full">
                <label for="trx-subject">الموضوع</label>
                <input type="text" id="trx-subject" name="subject" placeholder="مثال: تحويل مبلغ مالي" required>
              </div>

              <div class="field">
                <label for="trx-from">الجهة المرسلة</label>
                <input type="text" id="trx-from" name="from" value="الإدارة المالية">
              </div>
              <div class="field">
                <label for="trx-amount">المبلغ</label>
                <input type="text" id="trx-amount" name="amount" value="15,000.00" inputmode="decimal">
              </div>

              <div class="field">
                <label for="trx-to">الجهة المستقبلة</label>
                <select id="trx-to" name="to">
                  <option>شركة النور</option>
                  <option>شركة الأفق</option>
                  <option>مؤسسة البناء الحديث</option>
                  <option>الإدارة المالية</option>
                </select>
              </div>
              <div class="field">
                <label for="trx-date">تاريخ المعاملة</label>
                <input type="text" id="trx-date" name="date" value="2024/05/20" inputmode="numeric">
              </div>

              <div class="field">
                <label for="trx-priority">الأولوية</label>
                <select id="trx-priority" name="priority">
                  <option value="normal">عادية</option>
                  <option value="urgent">عاجلة</option>
                </select>
              </div>

              <div class="field field-full">
                <label for="trx-desc">الوصف</label>
                <textarea id="trx-desc" name="desc" placeholder="تفاصيل إضافية عن المعاملة (اختياري)"></textarea>
              </div>
            </div>

            <div class="dropzone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v12" />
                <path d="M7 8l5-5 5 5" />
                <path d="M5 21h14" />
              </svg>
              <span>اسحب الملفات هنا أو اضغط لاختيار ملفات</span>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                  <path d="M17 21v-8H7v8M7 3v5h8" />
                </svg>
                حفظ وإرسال
              </button>
              <button type="button" id="save-draft" class="btn btn-outline">حفظ كمسودة</button>
              <button type="button" class="btn btn-outline" data-goto="transactions.html">إلغاء</button>
            </div>
          </form>
        </div>
